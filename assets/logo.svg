<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="MPU FreiFahrt Logo">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e7d32"/>
      <stop offset="1" stop-color="#1b5e20"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7cc57f" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#2e7d32" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Compass mark -->
  <g transform="translate(70,60)" filter="url(#shadow)">
    <circle cx="240" cy="240" r="210" fill="none" stroke="url(#g1)" stroke-width="26"/>
    <circle cx="240" cy="240" r="165" fill="none" stroke="url(#g2)" stroke-width="16" opacity="0.95"/>

    <!-- 8-point star / compass rose -->
    <g transform="translate(240,240)">
      <polygon
        points="
          0,-190  18,-78  130,-130  78,-18
          190,0    78,18   130,130   18,78
          0,190   -18,78  -130,130  -78,18
          -190,0  -78,-18 -130,-130 -18,-78"
        fill="url(#g1)"/>
      <polygon
        points="
          0,-150  12,-55  95,-95  55,-12
          150,0   55,12    95,95   12,55
          0,150  -12,55   -95,95  -55,12
          -150,0 -55,-12  -95,-95 -12,-55"
        fill="#eaf3ea" opacity="0.95"/>

      <!-- North needle -->
      <polygon points="0,-170 20,-18 0,-40 -20,-18" fill="url(#g1)"/>
      <polygon points="0,170 20,18 0,40 -20,18" fill="url(#g2)" opacity="0.85"/>
      <circle cx="0" cy="0" r="14" fill="url(#g1)"/>
      <circle cx="0" cy="0" r="8" fill="#eaf3ea" opacity="0.95"/>
    </g>
  </g>

  <!-- Wordmark -->
  <g transform="translate(560,175)">
    <text x="0" y="0" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="190" font-weight="700" fill="url(#g1)" letter-spacing="2">
      MPU
    </text>
    <text x="8" y="190" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="118" font-weight="650" fill="url(#g1)">
      FreiFahrt
    </text>
  </g>
</svg>
